[build-system]
requires = ["setuptools>=65.5.0,<66", "wheel==0.41.2"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-level-parser"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
device-parser = "parser_cli:main"

[tool.setuptools]
py-modules = ["parser_cli"]

[tool.setuptools.packages.find]
include = ["protocol_parser*"]
